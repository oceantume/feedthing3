# How the box runs Feedthing: sourced by /opt/bin/run-app, app-switch and
# app-watchdog (infra repo), uploaded by bin/deploy.
IMAGE=feedthing
CPORT=8080
# Each slot's port on the box's 127.0.0.1; deploy/site.caddy lists the same two.
HPORT_A=4021
HPORT_B=4022
HEALTH_PATH=/healthz
# Hard limit: over it, the app is OOM-killed and restarted. feedthing2 ran on
# 256 MB of Node; polling a large feed holds a few MB of it at once.
MEM=256m
CPU_SHARES=1024
EXTRA_ARGS=(-v /var/lib/apps/feedthing:/data)
